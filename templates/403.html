<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 — Ruxsat berilmagan | O‘zYYE</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/static/images/favicon-192x192.png" sizes="192x192" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #060913;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      width: 60vw;
      height: 60vw;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.10;
    }
    body::before {
      top: -20%;
      left: -15%;
      background: radial-gradient(circle, #f59e0b, transparent 60%);
    }
    body::after {
      bottom: -25%;
      right: -15%;
      background: radial-gradient(circle, #d97706, transparent 60%);
    }

    .error-container {
      max-width: 620px;
      position: relative;
      z-index: 1;
    }

    .error-logo {
      height: 56px;
      width: auto;
      margin-bottom: 48px;
      filter: drop-shadow(0 0 12px rgba(0, 166, 235, 0.3));
      opacity: 0.9;
    }

    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(6rem, 18vw, 12rem);
      font-weight: 700;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 20px;
      letter-spacing: -0.04em;
    }

    .error-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.4rem, 3vw, 1.8rem);
      font-weight: 700;
      margin-bottom: 16px;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }

    .error-desc {
      font-size: 1.05rem;
      color: #94a3b8;
      margin-bottom: 40px;
      line-height: 1.8;
      font-weight: 300;
      max-width: 480px;
      margin-inline: auto;
    }

    .error-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 36px;
      background: linear-gradient(135deg, #00A6EB 0%, #0066FF 100%);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 16px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 166, 235, 0.35);
    }

    .error-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0, 166, 235, 0.55);
    }

    .error-divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #f59e0b, #d97706);
      border-radius: 100px;
      margin: 0 auto 24px;
      opacity: 0.6;
    }

    .error-footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 1;
    }
    .error-footer p {
      font-size: 0.78rem;
      color: #64748b;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <img src="/static/images/main_logo.png" alt="O‘zYYE" class="error-logo" />
    <div class="error-code">403</div>
    <div class="error-divider"></div>
    <h1 class="error-title">Ruxsat berilmagan</h1>
    <p class="error-desc">Siz ushbu sahifaga kirish huquqiga ega emassiz. Agar bu xatolik deb hisoblasangiz, biz bilan bog‘laning.</p>
    <a href="/" class="error-btn">Bosh sahifaga qaytish &rarr;</a>
  </div>
  <div class="error-footer">
    <p>&copy; 2026 O‘zbekiston Yetakchi Yoshlari Ensiklopediyasi</p>
  </div>
</body>
</html>
